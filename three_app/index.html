<!doctype html>
<html lang="en">
<head>
  <script type="importmap">{
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/": "https://unpkg.com/three@0.152.2/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pinball Sandbox (three.js + cannon-es)</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0b0f;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}
    #container{width:100%;height:100%;position:relative}
    #ui{position:absolute;left:12px;top:12px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #score{font-weight:700;padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:8px}
    button{padding:6px 10px;border-radius:6px;border:0;background:rgba(255,255,255,0.08);color:#fff}
    /* flipper layout: left and right at screen edges */
    #flippers{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:flex;justify-content:space-between;max-width:900px;margin:0 auto;padding:0 12px}
    .flip-btn{padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.04);color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #notice{position:absolute;left:12px;bottom:12px;color:#ddd;font-size:12px}
    /* small version badge */
    #version{position:absolute;right:10px;top:6px;font-size:12px;color:#bbb;z-index:30;background:rgba(255,255,255,0.02);padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.03)}

    /* Responsive tweaks for narrow/mobile screens */
    @media (max-width: 520px) {
      #ui { left:8px; right:8px; top:8px; gap:6px }
      #ui > button, #ui > div, #ui > label { font-size:13px }
      #flippers { left:8px; right:8px; bottom:8px; padding:0 8px }
      .flip-btn { padding:8px 10px }
      #version { font-size:11px; right:6px; top:6px }
      #motion-status, #motion-diagnostics { font-size:11px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="controls-row" style="display:flex;gap:8px;align-items:center">
      <button id="spawn">Spawn ball</button>
      <button id="clear">Clear balls</button>
      <label style="display:flex;align-items:center;color:#ddd;margin-left:6px"><input id="orbit" type="checkbox" checked style="margin-right:6px">Orbit</label>
      <details id="more-controls" style="margin-left:8px">
        <summary style="cursor:pointer">⋯</summary>
        <div id="more-inner" style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <button id="enable-motion">Enable Motion</button>
          <button id="simulate-tilt">Simulate Tilt</button>
          <div id="motion-status" style="font-size:12px;color:#ccc">Motion: unknown</div>
          <div id="motion-diagnostics" style="font-size:12px;color:#999">diag: --</div>
        </div>
      </details>
    </div>
  </div>

  <div id="flippers">
    <button id="left-flip" class="flip-btn" aria-label="Left flipper">◀</button>
    <button id="right-flip" class="flip-btn" aria-label="Right flipper">▶</button>
  </div>

  <div id="notice">Click/tap to spawn. On mobile allow motion access to enable tilt.</div>

  <!-- version badge: update on each publish -->
  <div id="version">v0.1.41</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
