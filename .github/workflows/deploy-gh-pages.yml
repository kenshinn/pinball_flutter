name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Grant the workflow the minimum elevated permission needed to push to gh-pages.
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy site to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # peaceiris action will use the provided token to push
          fetch-depth: 0

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./three_app
          publish_branch: gh-pages
          keep_files: false
