name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Grant the workflow the minimum elevated permission needed to push to gh-pages.
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy site to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Make bump script executable
        run: chmod +x scripts/bump_version.sh

      - name: Bump version and commit
        id: bump
        run: |
          set -euo pipefail
          NEW=$(./scripts/bump_version.sh)
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Show bumped version
        if: steps.bump.outputs.version != 'SKIP'
        run: echo "Bumped version -> ${{ steps.bump.outputs.version }}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./three_app
          publish_branch: gh-pages
          keep_files: false
